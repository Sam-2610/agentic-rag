services:
  api:
    build: .
    image: agentic-rag
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file: .env            # your LLM key stays in the api container only
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro   # your documents
      - chroma:/app/chroma_db # the search index survives restarts
      - artifacts:/app/artifacts

  ui:
    image: agentic-rag
    command: chainlit run ui.py --host 0.0.0.0 --port 8001 --headless
    environment:
      - API_URL=http://api:8000
    ports:
      - "8001:8001"
    depends_on:
      - api

volumes:
  chroma:
  artifacts:
